services:
  paperless-public-proxy:
    image: ghcr.io/j4n-e4t/paperless-public-proxy:latest
    environment:
      - PAPERLESS_BASE_URL=https://paperless.example.com/
      - TS_HOSTNAME=paperless-share
      - TS_AUTHKEY=your-key
      - TS_DIR=/app/tsnet-data
    volumes:
      - ./tsnet-data:/app/tsnet-data
    restart: unless-stopped